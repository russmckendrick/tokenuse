[package]
name = "tokenuse-desktop"
version = "1.2.5"
edition = "2021"
description = "Desktop app for local AI coding tool token and cost usage."
authors = ["Russ McKendrick"]
license = "MIT"

[lib]
name = "tokenuse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
color-eyre = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.4"
thiserror = "2.0.20"
tokenuse = { path = "../..", default-features = false }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11.0"

[features]
default = ["refresh-currency", "refresh-prices", "quota-sync"]
refresh-currency = ["tokenuse/refresh-currency"]
refresh-prices = ["tokenuse/refresh-prices"]
quota-sync = ["tokenuse/quota-sync"]
