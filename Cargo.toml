[package]
name = "tokenuse"
version = "1.2.5"
edition = "2021"
description = "A terminal dashboard for AI token usage analytics."
license = "MIT"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
dirs = "7.0.0"
walkdir = "2.5.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ureq = { version = "3.4.1", features = ["json"], optional = true }
# Fulgur's font stack enables yeslogic-fontconfig-sys/dlopen on Linux; keep
# Plotters/font-kit in the same mode so fontconfig bindings compile there.
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "bitmap_backend", "bitmap_encoder", "line_series", "ttf", "fontconfig-dlopen"] }
fulgur = "0.40.0"
rust_xlsxwriter = "0.99.0"
keyring = { version = "4.2.0", optional = true, default-features = false, features = ["v1"] }

[dev-dependencies]
lopdf = { version = "0.42.0", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
default = ["refresh-prices", "refresh-currency", "quota-sync"]
refresh-prices = ["ureq"]
refresh-currency = ["ureq"]
quota-sync = ["ureq", "keyring"]
