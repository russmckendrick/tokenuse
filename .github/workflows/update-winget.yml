name: "🪟 Update WinGet"

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
    outputs:
      pull_request_url:
        description: URL of the WinGet pull request created for this release.
        value: ${{ jobs.update-winget.outputs.pull_request_url }}
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to submit. Defaults to the latest GitHub release.
        required: false
        type: string

permissions:
  contents: read

jobs:
  update-winget:
    name: "🪟 Update WinGet Package"
    runs-on: windows-latest
    outputs:
      pull_request_url: ${{ steps.pr.outputs.url }}

    steps:
      - name: "🔐 Validate WinGet token"
        shell: pwsh
        env:
          EXPECTED_FORK_USER: ${{ github.repository_owner }}
          WINGET_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            throw "Missing WINGET_CREATE_GITHUB_TOKEN secret."
          }

          $headers = @{
            Authorization = "Bearer $env:WINGET_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $response = Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/user"
          $scopes = $response.Headers["X-OAuth-Scopes"]
          $viewer = $response.Content | ConvertFrom-Json

          if (-not $scopes) {
            throw "WINGET_CREATE_GITHUB_TOKEN must be a classic PAT with public_repo (or repo) and workflow scopes. Fine-grained PATs are not supported by vedantmgoyal9/winget-releaser."
          }

          $scopeList = @($scopes -split ',') | ForEach-Object { $_.Trim() }
          $missingScopes = @()

          if (-not (($scopeList -contains "public_repo") -or ($scopeList -contains "repo"))) {
            $missingScopes += "public_repo (or repo)"
          }

          if ($scopeList -notcontains "workflow") {
            $missingScopes += "workflow"
          }

          if ($missingScopes.Count -gt 0) {
            throw "WINGET_CREATE_GITHUB_TOKEN is missing required classic PAT scope(s): $($missingScopes -join ', '). Current scopes: $($scopeList -join ', ')"
          }

          if (-not $viewer.login) {
            throw "Unable to determine the GitHub user behind WINGET_CREATE_GITHUB_TOKEN."
          }

          $forkRepository = "$env:EXPECTED_FORK_USER/winget-pkgs"
          $fork = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$forkRepository"

          if (-not $fork.fork) {
            throw "Expected '$forkRepository' to be a fork of microsoft/winget-pkgs, but GitHub does not mark it as a fork."
          }

          if (-not $fork.parent -or $fork.parent.full_name -ne "microsoft/winget-pkgs") {
            throw "Expected '$forkRepository' to fork microsoft/winget-pkgs, but GitHub reports parent '$($fork.parent.full_name)'."
          }

          if ($fork.PSObject.Properties.Name -contains "permissions") {
            $hasWriteAccess = $fork.permissions.admin -or $fork.permissions.maintain -or $fork.permissions.push

            if (-not $hasWriteAccess) {
              throw "Token user '$($viewer.login)' does not have write access to '$forkRepository'."
            }
          }

          Write-Host "Validated classic PAT scopes for WinGet submission: $scopes"
          Write-Host "Token user: $($viewer.login)"
          Write-Host "WinGet fork: $forkRepository"

      - name: "🔄 Sync winget-pkgs fork with upstream"
        shell: pwsh
        env:
          FORK_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $forkRepository = "$env:FORK_USER/winget-pkgs"
          Write-Host "Syncing '$forkRepository' with microsoft/winget-pkgs."

          $syncOutput = & gh repo sync $forkRepository --source microsoft/winget-pkgs 2>&1
          $syncExitCode = $LASTEXITCODE

          if ($syncOutput) {
            $syncOutput | ForEach-Object { Write-Host $_ }
          }

          if ($syncExitCode -ne 0) {
            throw "Failed to sync '$forkRepository' with microsoft/winget-pkgs: 'gh repo sync' exited with code $syncExitCode. A stale fork makes komac fail with a misleading 'CreateRef' permission error. Confirm WINGET_CREATE_GITHUB_TOKEN has public_repo (or repo) and workflow scopes, then run 'gh repo sync $forkRepository --source microsoft/winget-pkgs' and re-run this workflow."
          }

          Write-Host "Synced '$forkRepository' with microsoft/winget-pkgs."

      - name: "🏷️ Resolve release tag"
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"

          if (-not $tag) {
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest"
            $tag = $release.tag_name
          }

          if (-not $tag) {
            throw "Unable to determine the release tag to submit to WinGet."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      # The release-by-tag endpoint (which vedantmgoyal9/winget-releaser uses
      # to build komac's --urls) can return the release with an empty asset
      # list for a long time after publishing, flipping between empty and full
      # responses. The per-release assets endpoint is consistent, so resolve
      # the MSI URL from there and drive komac directly.
      - name: "🔎 Resolve release MSI URL"
        id: msi
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $api = "https://api.github.com/repos/${{ github.repository }}"
          $releaseId = (Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/$tag").id
          $deadline = (Get-Date).AddMinutes(10)

          while ($true) {
            $assets = Invoke-RestMethod -Headers $headers -Uri "$api/releases/$releaseId/assets?per_page=100"
            $msi = @($assets | Where-Object { $_.name -match '^tokenuse-desktop-windows-amd64\.msi$' -and $_.state -eq 'uploaded' })
            if ($msi.Count -eq 1) {
              break
            }
            if ((Get-Date) -gt $deadline) {
              throw "Release $tag ($releaseId) has no uploaded tokenuse-desktop-windows-amd64.msi after 10 minutes."
            }
            Write-Host "Release $tag lists $(@($assets).Count) assets and no uploaded MSI yet; retrying in 30s."
            Start-Sleep -Seconds 30
          }

          $url = $msi[0].browser_download_url
          $response = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5
          Write-Host "Resolved $url (HTTP $($response.StatusCode))."
          "url=$url" >> $env:GITHUB_OUTPUT
          "version=$($tag -replace '^v')" >> $env:GITHUB_OUTPUT

      - name: "🧰 Install cargo-binstall"
        uses: cargo-bins/cargo-binstall@main
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: "🧰 Install komac"
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall komac -y

      - name: "📦 Submit WinGet package update"
        shell: pwsh
        env:
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          KOMAC_CREATED_WITH: tokenuse release workflow
          KOMAC_CREATED_WITH_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          komac update 'RussMckendrick.TokenUse' --version '${{ steps.msi.outputs.version }}' --submit --urls '${{ steps.msi.outputs.url }}'
          if ($LASTEXITCODE -ne 0) { throw "komac update exited with code $LASTEXITCODE" }

      - name: "🧹 Clean up merged komac branches"
        shell: pwsh
        continue-on-error: true
        env:
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: komac cleanup --only-merged

      - name: "🔗 Resolve WinGet pull request URL"
        id: pr
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $identifier = "RussMckendrick.TokenUse"
          $forkUser = "${{ github.repository_owner }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $version = $tag.TrimStart("v")
          $query = "repo:microsoft/winget-pkgs is:pr author:$forkUser in:title `"$identifier version $version`""
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $encodedQuery = [uri]::EscapeDataString($query)
          $result = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/search/issues?q=$encodedQuery&sort=created&order=desc&per_page=10"
          $pr = $result.items | Select-Object -First 1

          if (-not $pr -or -not $pr.html_url) {
            "url=" >> $env:GITHUB_OUTPUT
            "## WinGet Submission`n`nPull request URL could not be resolved automatically." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Host "WinGet pull request URL could not be resolved automatically."
            exit 0
          }

          "url=$($pr.html_url)" >> $env:GITHUB_OUTPUT
          "## WinGet Submission`n`n- Pull request: [$($pr.html_url)]($($pr.html_url))" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "Resolved WinGet pull request URL: $($pr.html_url)"
